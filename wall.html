<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走进 Nexora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0F1115;
    color: #E5E7EB;
    min-height: 100vh;
  }
  header {
    padding: 24px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header a {
    color: #9CA3AF;
    text-decoration: none;
    font-size: 14px;
  }
  header a:hover { color: #60A5FA; }

  .top {
    text-align: center;
    padding: 40px 20px 20px;
  }
  .top img {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    margin-bottom: 20px;
  }
  .top h1 {
    font-size: 32px;
    color: #fff;
    margin-bottom: 12px;
  }
  .top p {
    color: #9CA3AF;
    max-width: 600px;
    margin: 0 auto;
    font-size: 15px;
    line-height: 1.8;
  }

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 50px auto;
    padding: 0 20px;
  }
  .product {
    background: #1A1D23;
    border-radius: 16px;
    padding: 28px;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.5s,
                background 0.5s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .product::before {
    content: "";
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(96,165,250,0.15), transparent);
    transition: top 0.6s ease;
    z-index: 0;
  }
  .product:hover::before {
    top: 0;
  }
  .product:hover {
    transform: translateY(-8px);
    box-shadow: 0 24px 48px rgba(26, 115, 232, 0.3);
    background: #1F2530;
  }
  .product img {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .product h3 {
    font-size: 20px;
    color: #fff;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }
  .product p {
    font-size: 14px;
    color: #9CA3AF;
    line-height: 1.6;
    position: relative;
    z-index: 1;
  }

  footer {
    text-align: center;
    padding: 60px 20px 40px;
    color: #6B7280;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <a href=" ">← 返回主页</a >
</header>

<section class="top">
  < img src="logo.png" alt="Nexora Logo">
  <h1>走进 Nexora</h1>
  <p>这里陈列着我们做过的每一个产品，<br>每一个都长期、稳定、属于每一个人</p >
</section>

<section class="wall">
  <a class="product" href="index.html#products">
    < img src="cashguard_logo.png" alt="CashGuard">
    <h3>CashGuard 钱盾</h3>
    <p>本地现金流 + 资产管家。零订阅、纯本地、断网可用。</p >
  </a >

  <!-- 以后加新产品，复制上面这段 a.product 改内容 -->
</section>

<footer>
  © 2026 Nexora 奈科萨科技
</footer>

</body>
</html>
