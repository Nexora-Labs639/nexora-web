<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Nexora 奈科萨科技</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #F7F8FA;
    color: #333;
    line-height: 1.6;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #E5E7EB;
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;

    color: #1A73E8;
  }
  nav a {
    margin-left: 24px;
    color: #555;
    text-decoration: none;
    font-size: 15px;
  }
  nav a:hover { color: #1A73E8; }
  .hero {
    text-align: center;
    padding: 80px 20px 60px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F7F8FA 100%);
  }
  .hero h1 {
    font-size: 48px;
    color: #111;
    margin-bottom: 16px;
  }
  .hero p {
    font-size: 18px;
    color: #666;
    max-width: 640px;
    margin: 0 auto;
  }
  .products {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 20px;
  }
  .section-title {
    font-size: 26px;
    color: #111;
    margin-bottom: 30px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }
  .card h3 {
    font-size: 24px;
    color: #111;
    margin-bottom: 10px;
  }
  .card .subtitle {
    font-size: 15px;
    color: #666;
    margin-bottom: 20px;
  }
  .card .features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .tag {
    background: #EEF4FF;
    color: #1A73E8;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
  }
  .download-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  select {
    padding: 10px 16px;
    font-size: 15px;
    border: 1px solid #D1D5DB;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  .btn {
    background: #1A73E8;
    color: #fff;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { background: #1558C0; }
  .btn.secondary {
    background: #fff;
    color: #1A73E8;
    border: 1px solid #1A73E8;
  }
  .btn.secondary:hover { background: #EEF4FF; }
  footer {
    background: #fff;
    border-top: 1px solid #E5E7EB;
    padding: 40px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }
  footer a { color: #1A73E8; text-decoration: none; }
  .wall-link {
    display: inline-block;
    margin-top: 30px;
    font-size: 16px;
    color: #1A73E8;
    text-decoration: underline;
    text-underline-offset: 6px;
  }
  .wall-link:hover { color: #1558C0; }
  @media (max-width: 600px) {
    .hero h1 { font-size: 32px; }
    header { padding: 12px 20px; }
    nav a { margin-left: 12px; font-size: 13px; }

<body>

<header>

</header>

<section class="hero">
  <h1>Nexora 奈科萨</h1>
  <p>做改变世界的软件</p >
</section>

<section class="products" id="products">
  <h2 class="section-title">我们的产品</h2>

  <div class="card">
    <h3>CashGuard 钱盾</h3>
    <p class="subtitle">本地现金流 + 资产管家。零订阅、纯本地、断网可用。</p >

    <div class="features">
      <span class="tag">记账</span>
      <span class="tag">资产管家</span>
      <span class="tag">回收站</span>
      <span class="tag">曲线图</span>
      <span class="tag">导出 CSV</span>
    </div>

    <div class="download-row">
      <label for="version">选择版本：</label>
      <select id="version">
        <option value="1.1.0">1.1.0（最新）</option>
      </select>

      <a class="btn" id="downloadBtn" href="#" target="_blank">下载</a >
    </div>
  </div>
</section>

<section class="products" id="about">
  <h2 class="section-title">关于 Nexora</h2>
  <p style="text-align:center; max-width:700px; margin:0 auto; color:#666;">
    Nexora（奈科萨科技）致力于打造长期、稳定的软件产品。
    我们相信，好的工具应该属于每一个人。
  </p >
</section>

<div style="text-align:center;">
  <a class="wall-link" href="wall.html">走进 Nexora →</a >
</div>

<footer id="contact">
  <p>联系方式：<a href="mailto:sf1633@qq.com">sf1633@qq.com</a ></p >
  <p style="margin-top:8px;">© 2026 Nexora 奈科萨科技 · All rights reserved.</p >
</footer>

<script>
  const downloadLinks = {
    "1.1.0": "https://github.com/Nexora-Labs639/Nexora-Web/releases/download/v1.1.0/CashGuard_1.1.0.zip"
  };

  const versionSelect = document.getElementById("version");
  const downloadBtn = document.getElementById("downloadBtn");

  function updateDownloadLink() {
    const v = versionSelect.value;
    downloadBtn.href = downloadLinks[v] || "#";
  }

  versionSelect.addEventListener("change", updateDownloadLink);
  updateDownloadLink();
</script>

</body>
</html>
